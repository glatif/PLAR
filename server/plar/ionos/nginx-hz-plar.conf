# PLAR web app: public entry on port 8090 -> container on 127.0.0.1:9000.
# Installed as /etc/nginx/sites-available/hz-plar (same pattern as hz-living-heritage).
# $http_host keeps the port so Next.js Server Actions accept the Origin (see the server guide, section 11).
server {
    listen 8090;
    listen [::]:8090;
    server_name _;
    client_max_body_size 100M;
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
