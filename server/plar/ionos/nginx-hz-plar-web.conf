# PLAR web app on its hostname: port 80 here; `certbot --nginx` adds the 443 (TLS) block and the
# HTTP -> HTTPS redirect. Installed as /etc/nginx/sites-available/hz-plar-web by ../publish.sh,
# with __HOST__ replaced by the hostname.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;
    client_max_body_size 100M;
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
